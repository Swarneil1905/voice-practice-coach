name: voice-practice-coach
services:
  web:
    build: ./frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [api]
    restart: unless-stopped
  api:
    build: ./api
    env_file:
      - path: .env
        required: false
    environment:
      DJANGO_DEBUG: "true"
      ALLOWED_HOSTS: localhost,127.0.0.1,api
      QUOTA_DATABASE: /data/allowances.sqlite3
    volumes: ["demo-allowances:/data"]
    restart: unless-stopped
  agent:
    profiles: [voice]
    build: ./agent
    env_file: .env
    environment:
      VOICE_GATEWAY_URL: http://api:8000/api/provider
    restart: unless-stopped

volumes:
  demo-allowances:
